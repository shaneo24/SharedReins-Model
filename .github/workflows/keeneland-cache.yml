# Keeps the Keeneland sale-history cache filled, so nobody has to run anything.
#
# Keeneland sends no CORS header, so the site can never fetch it in the browser.
# This job does it on a schedule and parks the rows in Supabase; everyone who
# opens the site just sees them. No redeploy, no manual step, no terminal.
#
# ---------------------------------------------------------------- setting up
#
#   1. Repo -> Settings -> Secrets and variables -> Actions -> New secret
#        Name:   SR_CODE
#        Value:  your shared access code
#
#   2. Edit SALES below when a new catalogue opens. That is the only line that
#      needs touching from one season to the next.
#
#   The Supabase URL and public key are read from js/config.js in the repo —
#   they are public by design, so nothing else needs to be a secret.
#
# Runs daily because catalogues are not static: hips are withdrawn and
# supplements are added right up to the sale, and a mare added on Tuesday
# should not wait a week to be looked up.

name: Keeneland cache

on:
  schedule:
    # 06:30 UTC daily — early enough that the cache is warm before anyone in
    # Kentucky or Ireland opens the site.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      sales:
        description: 'Sales to fetch (space-separated, e.g. "N26A N26B 149")'
        required: false
        type: string
      refresh:
        description: 'Re-fetch mares already cached'
        required: false
        type: boolean
        default: false

# The sales worth caching. Fasig-Tipton codes are <region><yy><letter> — N New
# York, K Kentucky, M Midlantic, C California — and OBS sales are numeric ids.
# A manual run can override this from the form above.
#
#   N26A  Aug 10  The Saratoga Sale              N26B  Aug 16  New York Bred Yearlings
#   K26B  Jul 14  The July Sale                  K26A  Feb 09  Kentucky Winter Mixed
#   K25C  Oct 20  Kentucky October Yearlings     K25D  Nov 03  The November Sale
#   N25C  Oct 14  Saratoga Fall Mixed            M25B  Sep 30  Midlantic Fall Yearlings
#   C25B  Sep 23  California Fall Yearlings
#
# The 2026 autumn catalogues (October, November, the Fall mixed sales) are not
# published yet, so their 2025 editions stand in until they are — the mares are
# largely the same, and a mare cached once serves every sale she appears in.
#
# There is nothing to add for Keeneland. Their search is by MARE and returns
# every Keeneland sale her foals have been through — September, November and
# January all come back from the one lookup, for free.
env:
  DEFAULT_SALES: 'N26A N26B K26B K26A K25C K25D N25C M25B C25B'

jobs:
  fetch:
    runs-on: ubuntu-latest
    # The nine default sales are ~3,500 distinct mares, which takes about eight
    # minutes at four requests a second. This leaves room for a slow day
    # without letting a hung run burn minutes all night.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the access code is set
        env:
          SR_CODE: ${{ secrets.SR_CODE }}
        run: |
          if [ -z "$SR_CODE" ]; then
            echo "::error::SR_CODE secret is not set. Repo -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Inputs go in through the environment rather than being interpolated
      # into the script text, so a sale name can never be read as shell.
      - name: Fetch Keeneland sale history
        env:
          SR_CODE: ${{ secrets.SR_CODE }}
          INPUT_SALES: ${{ inputs.sales }}
          INPUT_REFRESH: ${{ inputs.refresh }}
        run: |
          SALES="${INPUT_SALES:-$DEFAULT_SALES}"
          REFRESH=""
          if [ "$INPUT_REFRESH" = "true" ]; then REFRESH="--refresh"; fi
          echo "Fetching: $SALES $REFRESH"
          node shared/fetch-keeneland.js $SALES $REFRESH
